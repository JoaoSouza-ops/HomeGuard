name: Firmware CI

# Valida o firmware:
#   1. testes unitários nativos da lógica (sem hardware)
#   2. compilação dos dois firmwares ESP32
#
# Quando roda:
#   - em qualquer push (qualquer branch) que altere firmware/ ou este arquivo
#   - em Pull Request para a main que altere firmware/ ou este arquivo
#   - manualmente: aba Actions -> "Firmware CI" -> "Run workflow"
on:
  push:
    branches: ["**"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Testes unitários (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Rodar testes nativos
        working-directory: firmware
        run: pio test -e native -v

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        project: [esp_normal, esp_vulneravel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles(format('firmware/{0}/platformio.ini', matrix.project)) }}

      - name: Instalar PlatformIO
        run: pip install platformio

      # secrets.h real nunca vai para o Git; no CI usamos o arquivo de exemplo.
      - name: Criar secrets.h de exemplo
        working-directory: firmware/${{ matrix.project }}
        run: cp include/secrets.example.h include/secrets.h

      - name: Compilar firmware
        working-directory: firmware/${{ matrix.project }}
        run: pio run

      - name: Guardar binário compilado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-firmware
          path: firmware/${{ matrix.project }}/.pio/build/esp32dev/firmware.bin
          if-no-files-found: error
