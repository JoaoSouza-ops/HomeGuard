; ESP "B" — dispositivo VULNERÁVEL de propósito (Telnet aberto).
; Gravar e ligar SOMENTE na rede de testes isolada (docs/06-SEGURANCA.md).
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags =
    -Wall
    -Wextra
