; Projeto "guarda-chuva" usado SÓ para rodar os testes unitários no PC (CI).
; Os firmwares de verdade ficam em esp_normal/ e esp_vulneravel/.
;
; Rodar localmente (na pasta firmware/):  pio test -e native
[platformio]
test_dir = test
lib_extra_dirs = lib

[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -std=c11
