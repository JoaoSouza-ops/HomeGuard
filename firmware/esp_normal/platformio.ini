; ESP "A" — dispositivo normal (sensor de temperatura via MQTT)
; Compilar:  pio run
; Gravar:    pio run -t upload
; Monitor:   pio device monitor
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -Wall
    -Wextra
